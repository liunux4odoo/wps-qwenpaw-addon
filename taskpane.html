<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WPS QwenPaw AI</title>
    <link rel="stylesheet" href="css/taskpane.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <span id="title">QwenPaw AI</span>
            <span id="statusDot" class="status-dot" title="连接状态"></span>
        </header>

        <div id="messages" class="messages"></div>

        <div id="toolbar" class="toolbar">
            <span id="toolStatus" class="tool-status">WPS 桥: --</span>
        </div>

        <div id="inputArea" class="input-area">
            <textarea id="input" rows="3" placeholder="输入指令，如：把第三段润色一下…"></textarea>
            <button id="sendBtn" class="send-btn">发送</button>
        </div>
    </div>

    <script src="js/acp-client.js"></script>
    <script src="js/wps-bridge.js"></script>
    <script src="js/chat-ui.js"></script>
    <script src="js/wps-poll-client.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
