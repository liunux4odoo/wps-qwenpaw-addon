<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>WPS QwenPaw AI</title>
    <link rel="stylesheet" href="css/taskpane.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <span id="title">QwenPaw AI</span>
            <div id="statusArea">
                <span id="statusDot" class="status-dot connecting" title="连接状态"></span>
                <span id="connLabel" class="conn-label">连接中</span>
                <span id="wpsLabel" class="wps-label pending" title="WPS 桥状态">WPS 待命</span>
            </div>
        </header>

        <div id="messages" class="messages"></div>

        <!-- P4：打字指示器（置于消息区外，避免被滚动隐藏） -->
        <div id="typingIndicator" class="typing" style="display:none">
            <span class="dots"><span></span><span></span><span></span></span>
            <span id="phaseLabel">思考中…</span>
        </div>

        <div id="toolbar" class="toolbar">
            <label class="toggle" title="显示/隐藏 AI 思考与工具调用过程">
                <input type="checkbox" id="showProcess" checked> 显示过程
            </label>
            <button id="settingsBtn" class="settings-btn" title="ACP 设置（server / 模型 / 能力说明）">⚙</button>
            <select id="agentSelect" class="agent-select" title="选择 AI agent"></select>
            <button id="clearBtn" class="clear-btn" title="清空当前对话历史">清空对话</button>
            <span id="toolStatus" class="tool-status">正在连接…</span>
        </div>

        <!-- Phase 3：ACP server 设置面板（选择 server / opencode 模型 / 能力差异说明） -->
        <div id="settingsPanel" class="settings-panel" style="display:none">
            <div class="settings-row">
                <label class="settings-label">ACP server</label>
                <select id="serverSelect" class="server-select" title="选择 ACP 后端"></select>
                <span id="serverDesc" class="server-desc"></span>
            </div>
            <div id="configOptionsRow" class="settings-row" style="display:none">
                <label class="settings-label">模型</label>
                <select id="modelSelect" class="config-select" title="会话级模型（set_config_option）"></select>
                <label class="settings-label">Effort</label>
                <select id="effortSelect" class="config-select" title="会话级思考强度"></select>
            </div>
            <div id="capabilityNotes" class="capability-notes"></div>

            <!-- P22：提示词模板管理（设置面板内，纯前端 localStorage） -->
            <div class="settings-row settings-title-row"><span class="settings-title">提示词模板</span></div>
            <div id="promptList" class="prompt-list"></div>
            <div class="settings-row prompt-add-row">
                <input type="text" id="promptName" class="prompt-name-input" placeholder="模板名" title="模板名（必填）">
                <button id="promptAddBtn" class="prompt-add-btn" title="添加到模板列表">添加</button>
            </div>
            <div class="prompt-text-row">
                <textarea id="promptText" class="prompt-text-input" rows="2" placeholder="模板内容（必填），支持 {{date}} / {{filename}} / {{fullpath}} / {{selection}}"></textarea>
            </div>
        </div>

        <!-- P22：提示词模板条（点击填入输入框，不自动发送） -->
        <div id="promptStrip" class="prompt-strip"></div>

        <div id="inputArea" class="input-area">
            <textarea id="input" rows="3" placeholder="输入指令，如：把第三段润色一下…（/help 查看指令）"></textarea>
            <button id="attachBtn" class="attach-btn" title="添加附件（文本文件，图片暂不支持）">
                <svg class="attach-icon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <input type="file" id="attachFile" multiple style="display:none">
            <button id="stopBtn" class="stop-btn" style="display:none">停止</button>
            <button id="sendBtn" class="send-btn">发送</button>
        </div>
    </div>

    <script src="js/acp-client.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/wps-bridge.js"></script>
    <script src="js/chat-ui.js"></script>
    <script src="js/wps-poll-client.js"></script>
    <script src="js/app-state.js"></script>
    <script src="js/doc-state.js"></script>
    <script src="js/prompts.js"></script>
    <script src="js/bridge-config.js"></script>
    <script src="js/session.js"></script>
    <script src="js/agents.js"></script>
    <script src="js/acp-events.js"></script>
    <script src="js/watchdog.js"></script>
    <script src="js/actions.js"></script>
    <script src="js/poll.js"></script>
    <script src="js/ribbon.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
